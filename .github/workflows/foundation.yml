name: foundation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
